spring.application.name=funky-gizmo
server.port=8080
spring.config.import=optional:classpath:application-local.properties

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 문의 메일 (보내는·받는 모두 Gmail)
contact.mail.from=funkkygizmo.mari@gmail.com
contact.mail.to=funkkygizmo.mari@gmail.com

# Gmail SMTP (비밀번호는 application-local.properties — Git 제외)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=funkkygizmo.mari@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
